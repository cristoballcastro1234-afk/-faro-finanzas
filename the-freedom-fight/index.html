function home(){const n=Object.keys(db.entries).filter(inRange).length;const clear=Object.values(db.entries).filter(x=>x.status==='clear').length,falls=Object.values(db.entries).filter(x=>x.status==='fall').length;const now=inRange(today())?today():db.startDate,idx=dayNo(now);const recent=Object.entries(db.entries).filter(([d])=>inRange(d)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,4);
let dots='';for(let i=13;i>=0;i--){const d=shift(now,-i);const s=db.entries[d]?.status;dots+=`<div class="day-dot"><button class="square ${s==='clear'?'clear':s==='fall'?'fall':''} ${d===today()?'today':''}" data-date="${d}" aria-label="${fmt(d)}: ${statusInfo(s).label}" title="${e(fmt(d))}"></button><small>${mkDate(d).toLocaleDateString('es-CL',{day:'numeric'})}</small></div>`}
return title('Hoy es un nuevo día','No tienes que demostrar nada aquí. Puedes escribir con sinceridad y cuidar de ti.',`<button class="btn secondary" data-action="lock">🔒 Bloquear</button>`)+`<section class="card hero"><span class="tag">📖 Día ${Math.max(1,Math.min(365,idx))} de 365</span><h2>La esperanza también empieza<br>con pasos pequeños.</h2><p>Este diario no mide tu valor. Guarda tu historia con verdad, compasión y el deseo de seguir caminando.</p><div class="buttons"><button class="btn primary" data-nav="escribir">✎ Escribir mi día</button><button class="btn secondary" data-nav="plan">♡ Necesito una pausa</button></div></section><div class="gap"></div><div class="grid three"><div class="card stat"><small>Días con anotaciones</small><strong>${n} <span class="muted" style="font-size:14px">/ 365</span></strong><p>La constancia de escribir cuenta</p></div><div class="card stat"><small>Días que te cuidaste</small><strong class="tint">${clear}</strong><p>Registrados por ti</p></div><div class="card stat"><small>Días difíciles</small><strong class="warm">${falls}</strong><p>Oportunidades de comprenderte</p></div></div><h2 class="section-title">Las últimas dos semanas</h2><div class="card"><div class="day-strip">${dots}</div><p class="small muted" style="margin-bottom:0">Las casillas sin marcar no significan una caída. Puedes completar días anteriores cuando lo necesites.</p></div><h2 class="section-title">Tus notas recientes</h2><div class="card">${recent.length?recent.map(([d,x])=>`<div class="item"><div><strong>${e(fmt(d))}</strong><p class="muted small no-marg">${e(x.learning||x.feeling||'Entrada guardada').slice(0,110)}</p></div><button class="btn small" data-date="${d}">Abrir</button></div>`).join(''):'<p class="muted">Aquí aparecerán tus reflexiones. Puedes comenzar hoy, incluso si ha sido un día difícil.</p>'}</div><div class="gap"></div><div class="callout"><span class="verse">«Cercano está Jehová a los quebrantados de corazón».</span> — Salmo 34:18. Tu fe puede ser fuente de consuelo, no otra forma de castigarte.</div>`}
const triggers=['Estrés','Soledad','Cansancio','Ansiedad','Aburrimiento','Tristeza','Redes sociales','Noche / madrugada','Conflictos','Otro'];
function journal(){if(!inRange(selected))selected=inRange(today())?today():db.startDate;const x=db.entries[selected]||{},s=x.status||'none';return title('Mi página de hoy','Escribe lo que viviste, cómo respondiste y qué puedes aprender. No hay calificaciones.')+`<form id="day-form"><div class="card"><div class="flexbetween"><div><div class="overline">Día ${dayNo(selected)} / 365</div><h2>${e(fmt(selected))}</h2></div><div class="field" style="margin:0"><label for="entry-date">Elegir fecha</label><input class="control" id="entry-date" type="date" value="${selected}" min="${db.startDate}" max="${lastDay()}"></div></div><hr><h3>¿Cómo fue este día?</h3><p class="muted small">Puedes dejarlo sin marcar hasta que quieras responder.</p><div class="options"><label class="option"><input type="radio" name="status" value="clear" ${s==='clear'?'checked':''}> Hoy no consumí pornografía</label><label class="option"><input type="radio" name="status" value="fall" ${s==='fall'?'checked':''}> Tuve una caída y sigo adelante</label><label class="option"><input type="radio" name="status" value="none" ${s==='none'?'checked':''}> Prefiero no marcarlo ahora</label></div><div class="gap"></div><div class="field"><label for="mood">¿Cómo te sientes hoy?</label><select class="control" id="mood" name="mood"><option value="">Prefiero no elegir</option>${[['1','Muy sobrepasado'],['2','Triste o inquieto'],['3','Mezcla de emociones'],['4','Con esperanza'],['5','En paz']].map(([n,t])=>`<option value="${n}" ${x.mood===n?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>¿Qué hizo difícil el día? (opcional)</label><div class="chips">${triggers.map(t=>`<label class="chip"><input type="checkbox" name="triggers" value="${e(t)}" ${x.triggers?.includes(t)?'checked':''}>${e(t)}</label>`).join('')}</div></div></div><div class="gap"></div><div class="card"><h2>Tres preguntas para volver a mirarte</h2><p class="muted small">Como en tu diario original de 365 días.</p>${fieldArea('feeling','¿Cómo me sentí?',x.feeling,'Ponle nombre a lo que has vivido, sin juzgarte.')}${fieldArea('fought','¿Cómo luché?',x.fought,'¿Qué hiciste para cuidarte? ¿Qué fue difícil?')}${fieldArea('learning','¿Qué aprendí?',x.learning,'Una observación amable y concreta que puedas aprovechar.')}</div><div class="gap"></div><div class="card"><h2>Mirando hacia mañana</h2><div class="gap"></div>${fieldArea('need','¿Qué necesito en este momento?',x.need,'Descanso, apoyo, claridad, compañía…')}${fieldArea('nextStep','Una acción pequeña para mañana',x.nextStep,'Ej.: dejar el celular fuera de la habitación por la noche.')}${fieldArea('prayer','Mi oración o reflexión personal (opcional)',x.prayer,'Escribe libremente; este espacio también es tuyo.')}<div class="flexbetween"><span id="saved-flag" class="savehint">Tu texto se guarda cifrado automáticamente en este dispositivo.</span><button class="btn primary" type="submit">Guardar mi día</button></div></div></form><div class="gap"></div><div class="callout gold">Si hoy hubo una caída, evita convertirla en un juicio sobre tu persona. Observa qué ocurrió y busca un siguiente paso. Pedir ayuda también cuenta.</div>`}
function fieldArea(name,label,val,placeholder){return `<div class="field"><label for="${name}">${label}</label><textarea class="control" id="${name}" name="${name}" rows="3" maxlength="6000" placeholder="${e(placeholder)}">${e(val||'')}</textarea></div>`}
function saveDraft(){if(screen!=='escribir'||!db||!$('day-form'))return;const f=$('day-form');const q=new FormData(f);const o={status:q.get('status')||'none',mood:q.get('mood')||'',triggers:q.getAll('triggers'),feeling:q.get('feeling')||'',fought:q.get('fought')||'',learning:q.get('learning')||'',need:q.get('need')||'',nextStep:q.get('nextStep')||'',prayer:q.get('prayer')||'',savedAt:new Date().toISOString()};const any=o.status!=='none'||o.mood||o.triggers.length||[o.feeling,o.fought,o.learning,o.need,o.nextStep,o.prayer].some(x=>x.trim());if(any)db.entries[selected]=o;else delete db.entries[selected];dirty=true;persist();const flag=$('saved-flag');if(flag)flag.textContent='✓ Cambios guardados de forma cifrada.'}
function calendar(){const [y,m]=visibleMonth.split('-').map(Number);const offset=(new Date(y,m-1,1).getDay()+6)%7;const count=new Date(y,m,0).getDate();let days='';for(let i=0;i<offset;i++)days+='<div class="cal-empty"></div>';for(let n=1;n<=count;n++){const d=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;const s=db.entries[d]?.status;days+=`<button class="cal-day ${s==='clear'?'clear':s==='fall'?'fall':''} ${d===today()?'today':''} ${!inRange(d)?'out':''}" data-date="${d}" ${!inRange(d)?'disabled':''} aria-label="${e(fmt(d))} ${statusInfo(s).label}"><span>${n}</span><i class="mark"></i></button>`}return title('Mi calendario','Una mirada a tus días, sin castigos ni comparaciones.')+`<div class="card"><div class="months"><button class="btn small secondary" data-action="month-prev" aria-label="Mes anterior">‹ Anterior</button><h2>${e(monthTitle(y,m-1))}</h2><button class="btn small secondary" data-action="month-next" aria-label="Mes siguiente">Siguiente ›</button></div><div class="calendar">${['Lu','Ma','Mi','Ju','Vi','Sa','Do'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${days}</div><div class="legend"><span><i class="good"></i> Día de cuidado</span><span><i class="hard"></i> Día difícil</span><span><i></i> Sin marcar</span></div><p class="small muted">Toca una fecha para leer o completar tus notas. El calendario sigue las 365 fechas de tu diario.</p></div>`}
function reflections(){const last=Math.min(365,dayNo(today()));const options=[];for(let n=30;n<=360;n+=30)options.push(n);options.push(365);const current=db.reflections[String(review)]||{};
return title('Pausas para reflexionar','Cada 30 días puedes mirar lo vivido con verdad y compasión.')+`<div class="grid two"><div class="card"><h2>Mis pausas de reflexión</h2><div class="gap"></div><div class="reflection-list">${options.map((n,i)=>`<button class="reflection-row" data-review="${n}"><div><strong>${n===365?'Cierre del año · día 365':`Pausa ${String(i+1).padStart(2,'0')} · días ${n-29}–${n}`}</strong><div><span>${db.reflections[String(n)]?'✓ Reflexión guardada':n>last?'Puedes prepararla cuando quieras':'Disponible para escribir'}</span></div></div><span>${n===review?'●':'›'}</span></button>`).join('')}</div></div><div class="card"><div class="overline">${review===365?'Reflexión final':'Pausa de reflexión'}</div><h2>${review===365?'Al terminar este año':`Días ${review-29} a ${review}`}</h2><div class="gap"></div><form id="review-form">${fieldArea('helped',review===365?'¿Qué cambió en mi manera de comprenderme?':'Lo que más me ayudó',current.helped,'¿Qué decisiones, personas o prácticas te sostuvieron?')}${fieldArea('hard',review===365?'¿Qué aprendí de mis días difíciles?':'Lo que me costó',current.hard,'¿Qué emociones y momentos me hicieron vulnerable?')}${fieldArea('step',review===365?'¿Qué quiero llevar conmigo al próximo año?':'Un paso concreto para los próximos 30 días',current.step,'Una decisión pequeña y realizable.')}${fieldArea('grace','Algo por lo que doy gracias (opcional)',current.grace,'Puedes escribir una oración o un agradecimiento.')}<button type="submit" class="btn primary">Guardar reflexión</button></form></div></div>`}
function plan(){return title('Mi plan para momentos difíciles','No necesitas resolver toda tu vida durante un impulso. Puedes cuidarte durante los próximos minutos.')+`<div class="card hero"><span class="tag">♡ Pausa de cuidado · 10 minutos</span><h2>Una decisión a la vez.</h2><p>Que aparezca una tentación no significa que debas actuar. Puedes responder con una acción concreta y pedir compañía.</p><div class="buttons"><button class="btn primary" data-action="start-pause">Comenzar pausa de 10 minutos</button><button class="btn secondary" data-nav="escribir">Escribir lo que siento</button></div><div id="pause-area"></div></div><div class="gap"></div><div class="grid two"><div class="card"><h2>Pasos cuando necesito parar</h2><ul class="steps"><li><span class="number">1</span><div><strong>Aléjate del estímulo.</strong><div class="muted small">Deja el teléfono a un lado; cambia de habitación o sal a caminar.</div></div></li><li><span class="number">2</span><div><strong>Respira y observa.</strong><div class="muted small">Nota lo que sientes, sin discutir con tus emociones ni avergonzarte.</div></div></li><li><span class="number">3</span><div><strong>Busca conexión.</strong><div class="muted small">Habla con alguien de confianza si puedes. No tienes que contar todo.</div></div></li><li><span class="number">4</span><div><strong>Elige una acción breve.</strong><div class="muted small">Toma agua, descansa, lee, ora o haz una tarea sencilla.</div></div></li></ul></div><div class="card"><h2>Mi recordatorio personal</h2><p class="verse">«Bástate mi gracia; porque mi poder se perfecciona en la debilidad». — 2 Corintios 12:9.</p><div class="callout">${e(db.plan.words||'Un día difícil no define quién soy.')}</div><div class="gap"></div><p class="muted small">No necesitas enfrentar esto únicamente con fuerza de voluntad. Un acompañante espiritual de confianza y un terapeuta pueden ayudarte a reconocer patrones y desarrollar herramientas.</p></div></div><h2 class="section-title">Mi red de cuidado</h2><div class="card"><form id="plan-form">${fieldArea('why','Por qué quiero avanzar',db.plan.why,'Una razón profunda, desde tus valores.')}${fieldArea('actions','Acciones que me ayudan a estar a salvo de una recaída',db.plan.actions,'Ej.: apartar el celular, salir a caminar, descansar…')}${fieldArea('contacts','Personas con quienes puedo hablar (solo nombres o apodos)',db.plan.contacts,'Un hermano de la iglesia, un amigo, mi pastor, un profesional…')}${fieldArea('words','Palabras que quiero recordarme',db.plan.words,'Sé paciente contigo. Pide ayuda cuando lo necesites.') }<button class="btn primary" type="submit">Guardar mi plan</button></form></div>`}
function settings(){return title('Ajustes y privacidad','Este diario vive en tu navegador. Tú controlas tus notas y tus respaldos.')+`<div class="card"><h2>Seguridad</h2><p class="muted small">Tus entradas están cifradas con contraseña. Los datos no se envían a ningún servidor. El código de la app puede alojarse en un sitio público, pero tus anotaciones permanecen en tu dispositivo.</p><div class="buttons"><button class="btn primary" data-action="backup">↓ Descargar respaldo cifrado</button><button class="btn" data-action="restore">↑ Recuperar respaldo</button><button class="btn secondary" data-action="change-pass">Cambiar contraseña</button><button class="btn secondary" data-action="lock">🔒 Bloquear</button></div><p class="muted small">Guarda el respaldo en un lugar seguro y conserva tu contraseña. Si borras los datos del navegador o cambias de teléfono, necesitarás el respaldo para recuperar tus notas.</p></div><div class="gap"></div><div class="card"><h2>Mi recorrido</h2><p class="muted small">Basado en el diario original de 365 días. Puedes ajustar la fecha inicial solamente antes de escribir anotaciones.</p><div class="field"><label>Fecha de inicio</label><input class="control" id="start-date" type="date" value="${db.startDate}" ${Object.keys(db.entries).length||Object.keys(db.reflections).length?'disabled':''}></div><button class="btn secondary" data-action="start-change" ${Object.keys(db.entries).length||Object.keys(db.reflections).length?'disabled':''}>Cambiar fecha inicial</button><p class="small muted">Actualmente: ${e(fmt(db.startDate))} hasta ${e(fmt(lastDay()))}.</p></div><div class="gap"></div><div class="card"><h2>¿Qué hace esta aplicación?</h2><p class="muted small">Registra reflexiones y preferencias, muestra calendario y pausas de 30 días. No bloquea contenido, no vigila tu navegación, no diagnostica ni sustituye tratamiento. Tampoco tiene sincronización entre dispositivos.</p><p class="small muted">Los datos se conservan solamente en el almacenamiento de este navegador, protegidos con AES-GCM y una clave derivada de tu contraseña mediante PBKDF2. No se ha realizado una auditoría externa de seguridad.</p></div><div class="gap"></div><div class="card danger-zone"><h2>Eliminar este diario</h2><p class="muted small">Esta acción elimina de este navegador las entradas y la contraseña asociada. No podrás recuperarlas sin un respaldo válido.</p><button class="btn danger" data-action="wipe">Eliminar todos mis datos locales</button></div>`}
function dialogOpen(title,body){const d=$('modal');d.innerHTML=`<h2>${e(title)}</h2><div class="gap"></div>${body}`;if(!d.open)d.showModal()}
function dialogClose(){if($('modal').open)$('modal').close()}
const cancelBtn='<button type="button" class="btn secondary" data-action="close-modal">Cancelar</button>';
function restoreDialog(fromGate){dialogOpen('Restaurar respaldo cifrado',`<div class="callout gold">Se sustituirá el diario guardado en este navegador por el del respaldo. Si ya tienes anotaciones, descarga primero un respaldo de ellas.</div><div class="gap"></div><form id="restore-form"><div class="field"><label>Archivo de respaldo .json</label><input type="file" id="restore-file" class="control" accept=".json,application/json" required></div><div class="field"><label>Contraseña de ese respaldo</label><input type="password" class="control" id="restore-pass" autocomplete="off" required></div><div class="buttons"><button class="btn primary" type="submit">Restaurar diario</button>${cancelBtn}</div></form>`)}
function passwordDialog(){dialogOpen('Cambiar contraseña',`<form id="pass-form"><div class="field"><label>Nueva contraseña (mínimo 10 caracteres)</label><input class="control" type="password" id="new-pass" autocomplete="off" minlength="10" required></div><div class="field"><label>Repite la nueva contraseña</label><input class="control" type="password" id="new-pass-confirm" autocomplete="off" minlength="10" required></div><div class="buttons"><button class="btn primary" type="submit">Actualizar protección</button>${cancelBtn}</div></form>`)}
function download(filename,text){const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openJournal(d){if(inRange(d)){selected=d;visibleMonth=d.slice(0,7);navigate('escribir')}}
$('application').addEventListener('click',ev=>{const btn=ev.target.closest('[data-nav],[data-date],[data-action],[data-review]');if(!btn)return;lastInteraction=Date.now();if(btn.dataset.date){openJournal(btn.dataset.date);return}if(btn.dataset.nav){navigate(btn.dataset.nav);return}if(btn.dataset.review){review=Number(btn.dataset.review);page();return}switch(btn.dataset.action){case'lock':lock();break;case'month-prev':{const [y,m]=visibleMonth.split('-').map(Number);visibleMonth=iso(new Date(y,m-2,1)).slice(0,7);page();break}case'month-next':{const [y,m]=visibleMonth.split('-').map(Number);visibleMonth=iso(new Date(y,m,1)).slice(0,7);page();break}case'backup':{persist().then(()=>{const current=rawRec();if(current){download('mi_diario_de_libertad_respaldo_'+today()+'.json',JSON.stringify({app:'Diario de Libertad',...JSON.parse(current)},null,2));notify('Respaldo cifrado descargado. Conserva también la contraseña.')}});break}case'restore':restoreDialog(false);break;case'change-pass':passwordDialog();break;case'close-modal':dialogClose();break;case'start-pause':{const area=$('pause-area');const end=Date.now()+600000;function tick(){if(!area?.isConnected)return;const left=Math.max(0,Math.ceil((end-Date.now())/1000));const mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');area.innerHTML=`<div class="callout" style="margin-top:18px">🕊️ Regálate esta pausa. Respira lento y, si puedes, cambia de lugar.<br><strong style="font-size:25px">${mm}:${ss}</strong><br><span class="muted small">Puedes salir de esta pantalla cuando quieras. El tiempo no es una prueba.</span></div>`;if(left)pauseTimer=setTimeout(tick,1000)}clearTimeout(pauseTimer);tick();break}case'start-change':{const d=$('start-date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(mkDate(d).getTime())){notify('Elige una fecha válida',true);break}if(Object.keys(db.entries).length||Object.keys(db.reflections).length)break;db.startDate=d;selected=inRange(today())?today():d;visibleMonth=selected.slice(0,7);persist().then(()=>notify('Fecha de inicio actualizada'));page();break}case'wipe':{if(confirm('¿Eliminar PERMANENTEMENTE tus notas locales? No podrás recuperarlas sin un respaldo.')&&prompt('Para confirmar, escribe BORRAR')==='BORRAR'){localStorage.removeItem(STORAGE);lock();notify('Datos locales eliminados')}}break}});
let pauseTimer=null;
$('application').addEventListener('change',ev=>{if(ev.target.id==='entry-date'){if(dirty)saveDraft();openJournal(ev.target.value)}});
$('application').addEventListener('input',ev=>{if(!ev.target.closest('#day-form')||ev.target.id==='entry-date')return;dirty=true;const f=$('saved-flag');if(f)f.textContent='Escribiendo…';clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,550)});
$('application').addEventListener('change',ev=>{if(!ev.target.closest('#day-form')||ev.target.id==='entry-date')return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,350)});
$('application').addEventListener('submit',ev=>{if(ev.target.id==='day-form'){ev.preventDefault();clearTimeout(saveTimer);saveDraft();notify('Tu página quedó guardada con cuidado.')}else if(ev.target.id==='review-form'){ev.preventDefault();const q=new FormData(ev.target);db.reflections[String(review)]={helped:q.get('helped')||'',hard:q.get('hard')||'',step:q.get('step')||'',grace:q.get('grace')||'',savedAt:new Date().toISOString()};persist().then(()=>notify('Reflexión guardada.'));page()}else if(ev.target.id==='plan-form'){ev.preventDefault();const q=new FormData(ev.target);db.plan={why:q.get('why')||'',actions:q.get('actions')||'',contacts:q.get('contacts')||'',words:q.get('words')||''};persist().then(()=>notify('Plan personal guardado.'))}});
$('modal').addEventListener('click',ev=>{const b=ev.target.closest('[data-action="close-modal"]');if(b)dialogClose()});
$('modal').addEventListener('submit',async ev=>{ev.preventDefault();if(ev.target.id==='restore-form'){const file=$('restore-file').files?.[0],pass=$('restore-pass').value;if(!file)return;try{if(file.size>8000000)throw Error('El respaldo es demasiado grande');const rec=JSON.parse(await file.text());const out=await decrypt(rec,pass);if(!confirm('¿Confirmas reemplazar el diario local por este respaldo?'))return;await writing;localStorage.setItem(STORAGE,JSON.stringify(rec));db=out.data;key=out.key;record=rec;dialogClose();selected=inRange(today())?today():db.startDate;visibleMonth=selected.slice(0,7);showApp();notify('Respaldo restaurado correctamente.')}catch(err){notify('No se pudo restaurar: comprueba el archivo y la contraseña.',true)}}else if(ev.target.id==='pass-form'){const one=$('new-pass').value,two=$('new-pass-confirm').value;if(one!==two){notify('Las contraseñas no coinciden.',true);return}if(one.length<10){notify('Mínimo 10 caracteres.',true);return}try{await writing;const salt=crypto.getRandomValues(new Uint8Array(16)),newKey=await derive(one,salt);const newRec=await encrypt(db,newKey,salt);localStorage.setItem(STORAGE,JSON.stringify(newRec));key=newKey;record=newRec;dialogClose();notify('Contraseña actualizada. Descarga un respaldo nuevo.')}catch(err){notify('No fue posible cambiar la contraseña.',true)}}});
$('vault').addEventListener('click',ev=>{if(ev.target.closest('[data-action="import-gate"]'))restoreDialog(true)});
['touchstart','pointerdown','keydown'].forEach(evt=>document.addEventListener(evt,()=>{lastInteraction=Date.now()},{passive:true}));
setInterval(()=>{if(db&&Date.now()-lastInteraction>10*60*1000)lock()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)saveDraft()});
window.addEventListener('pagehide',()=>{if(dirty)saveDraft()});
async function boot(){if(!globalThis.isSecureContext||!globalThis.crypto?.subtle||!globalThis.localStorage){$('vault').innerHTML='<div class="gate-card"><h1>Abre The Freedom Fight de forma segura</h1><p>Tu navegador no permite el cifrado o almacenamiento desde esta ubicación. Abre la aplicación desde una dirección HTTPS en Chrome actualizado y fuera del modo incógnito.</p></div>';return}try{const k='diario-test';localStorage.setItem(k,'ok');localStorage.removeItem(k);if(rawRec())JSON.parse(rawRec());gate()}catch(err){$('vault').innerHTML='<div class="gate-card"><h1>No hay almacenamiento seguro disponible</h1><p>Revisa los permisos de almacenamiento del navegador. No guardaremos entradas sin cifrado.</p></div>'}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
boot();
})();
</script></body></html>
